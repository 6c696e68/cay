name: Build and Release Cay

on:
  push:
    tags:
      - 'v*'
      - 'cay'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Windows (CMake)
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Publish Windows to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/cay.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS Universal (Intel + M1/M2)
        run: |
          cmake -B build -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"
          cmake --build build --config Release

      - name: Archive macOS App Bundle
        run: |
          # Use ditto to preserve permissions and resource forks
          ditto -c -k --sequesterRsrc --keepParent build/cay.app build/cay-mac.zip

      - name: Publish macOS to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/cay-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-fcitx5:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake extra-cmake-modules fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev

      - name: Build Fcitx5 Plugin (CMake)
        run: |
          mkdir -p build-fcitx5
          cd build-fcitx5
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_FCITX5=ON
          make -j$(nproc)

      - name: Archive Linux fcitx5 Plugin
        run: |
          cd build-fcitx5
          make install DESTDIR=$PWD/install_root
          cd install_root
          tar -czvf cayime-fcitx5-linux.tar.gz usr/
          mv cayime-fcitx5-linux.tar.gz ../../

      - name: Publish Linux to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: cayime-fcitx5-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
